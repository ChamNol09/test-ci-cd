
name: Deploy Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.MY_VPS_SECRET }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan -H -T 10 "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$VPS_HOST" \
            "echo 'SSH connection successful'"


      - name: Create deployment directory
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_HOST: ${{ secrets.MY_VPS_SECRET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$VPS_HOST" \
            "mkdir -p ~/node-app"

      - name: Install production dependencies and restart
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_HOST: ${{ secrets.MY_VPS_SECRET }}
        run: |
          ssh "$SSH_USER@$VPS_HOST" \
            "cd ~/node-app && npm ci --omit=dev && pm2 restart YOUR_PM2_APP_NAME --update-env"
